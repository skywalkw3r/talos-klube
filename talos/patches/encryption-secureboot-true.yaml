# Disk encryption for SECUREBOOT=true, picked by talconfig.yaml.
# Secure Boot on: keys sealed by the vTPM against the measured (UKI) boot.
# Keep encryption in ONE patch only: key lists merge by appending, and two
# keys claiming the same LUKS slot fail validation.
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - tpm: {}
      slot: 0
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  keys:
    - tpm: {}
      slot: 0
