# Keycloak serves under /auth (the chart's http.relativePath). Only the
# public port is routed: health and metrics stay on the management port
# (9000), inside the cluster. A bare https://<hostname>/ is redirected to
# /auth/ rather than left as a Keycloak 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs:
  - name: keycloak
    sectionName: https
  hostnames:
  - {{ .Values.hostname | quote }}
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /auth/
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: /auth
    backendRefs:
    - name: keycloak-keycloakx-http
      port: 80
