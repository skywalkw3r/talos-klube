{{- if .Values.oidc.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ printf "%s%s" .Values.oidc.groupsPrefix .Values.oidc.adminGroup | quote }}
---
# Same read-only reach as the headlamp-viewer ServiceAccount: namespaced
# `view` (no Secrets) plus the cluster-scoped reads it lacks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-viewers-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ printf "%s%s" .Values.oidc.groupsPrefix .Values.oidc.viewerGroup | quote }}
{{- if .Values.viewer.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-viewers-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.viewer.name }}-cluster-read
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ printf "%s%s" .Values.oidc.groupsPrefix .Values.oidc.viewerGroup | quote }}
{{- end }}
{{- end }}
