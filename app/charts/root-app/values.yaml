# Modern-stack defaults (Cilium for everything). Per-cluster overlays can
# flip toggles/versions; selfValueFiles controls which values files the
# self-managing root-app Application passes to itself (empty -> this file).
selfValueFiles: []

apps:
  bitwarden: false        # re-enable once storage + SMTP are wired to the new cluster
  cdi: true              # disk import; pairs with kubevirt
  cephCsiDrivers: true   # RBD/CephFS CSI drivers; required by Rook >= 1.20
  certManager: true
  cilium: true
  kubevirt: true
  externalSecrets: true
  gatewayApiCrds: true
  harbor: false          # needs harbor-secrets + a site hostname first; docs/harbor.md
  headlamp: true
  issuers: true
  keycloak: true
  kubePrometheusStack: true
  metricsServer: true
  rbac: true
  rookCeph: true
  rookCephCluster: true
  trivyOperator: true

# Headlamp UI plugins. Side-loaded by initContainer; see templates/headlamp.yaml.
headlampPlugins:
  kubevirt:
    enabled: true
    image: ghcr.io/naval-group/headlamp-kubevirt
    # Immutable digest of :latest as resolved 2026-07-23. Upstream publishes no
    # semver image tags, so there is nothing better to pin to.
    digest: sha256:7cdff58fdda4f3ad7b7a208b83744ec82648795056cf726f0ce5df2501ee3d14

# Harbor registry (templates/harbor.yaml). hostname is a PLACEHOLDER: a
# site's real name never lands in this public repo — set it per site
# (docs/harbor.md). It drives externalURL, the Gateway listener and its
# certificate, so clients must resolve it to the Gateway's LB IP.
harbor:
  hostname: harbor.example.internal
  registrySize: 100Gi

versions:
  # Each pin carries a `# renovate:` annotation naming its upstream, which a
  # custom manager in /renovate.json reads; keep it directly above the key.
  #
  # KubeVirt/CDI manifests are vendored into their charts by
  # app/charts/vendor.sh, so these are documentation of the pinned release
  # rather than a chart reference. Keep them in step with what was vendored.
  # renovate: datasource=github-releases depName=kubevirt/kubevirt
  kubevirt: v1.9.1
  # renovate: datasource=github-releases depName=kubevirt/containerized-data-importer
  cdi: v1.66.1
  # renovate: datasource=helm depName=ceph-csi-drivers registryUrl=https://ceph.github.io/ceph-csi-operator
  cephCsiDrivers: 1.1.0
  # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
  certManager: v1.21.3
  # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
  externalSecrets: 2.14.0
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  gatewayApi: v1.6.3
  # Chart version; the Harbor app version it ships is in the chart's appVersion.
  # renovate: datasource=helm depName=harbor registryUrl=https://helm.goharbor.io
  harbor: 1.19.4
  # renovate: datasource=helm depName=headlamp registryUrl=https://kubernetes-sigs.github.io/headlamp/
  headlamp: 0.46.0
  # renovate: datasource=helm depName=keycloakx registryUrl=https://codecentric.github.io/helm-charts
  keycloakx: 7.4.0
  # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
  kubePrometheusStack: 92.13.1
  # renovate: datasource=helm depName=metrics-server registryUrl=https://kubernetes-sigs.github.io/metrics-server/
  metricsServer: 3.14.0
  # Since 1.20 Rook leaves the CSI drivers to ceph-csi-operator: the Driver
  # CRs come from the ceph-csi-drivers app. Existing clusters must step
  # through 1.20.x — Rook doesn't support skipping a minor. Drives both the
  # rook-ceph and rook-ceph-cluster charts.
  # renovate: datasource=helm depName=rook-ceph registryUrl=https://charts.rook.io/release
  rookCeph: v1.21.0
  # renovate: datasource=helm depName=trivy-operator registryUrl=https://aquasecurity.github.io/helm-charts/
  trivyOperator: 0.37.0
